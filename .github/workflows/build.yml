name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "gpr.user=${{ github.actor }}" >> local.properties
          echo "gpr.key=${{ secrets.GH_PACKAGES_TOKEN }}" >> local.properties

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :tool:assembleDebug

      - name: Build release APK
        run: ./gradlew :tool:assembleRelease

      - name: Rename APKs
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp tool/build/outputs/apk/debug/tool-debug.apk ledger-v${VERSION}-debug.apk
          cp tool/build/outputs/apk/release/tool-release.apk ledger-v${VERSION}-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ledger-v*-debug.apk
            ledger-v*-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
